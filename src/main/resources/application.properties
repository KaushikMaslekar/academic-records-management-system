spring.application.name=academic-records-management-system

# Server port configuration
server.port=8080

# MongoDB connection
spring.data.mongodb.uri=mongodb://localhost:27017/academic-records-management-system
spring.data.mongodb.auto-index-creation=true

# JWT Configuration
# IMPORTANT: Change this to a strong secret key in production!
# Example: app.jwt.secret=your_very_long_and_secure_secret_key_min_32_characters
app.jwt.secret=your_secret_key_change_this_in_production_environment_please
# Token expiration time in milliseconds (86400000 = 24 hours)
app.jwt.expiration=86400000

# Logging configuration
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
